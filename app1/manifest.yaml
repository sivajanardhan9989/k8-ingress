apiVersion: v1 
kind: Deployment 
metadata: 
  name: app-1
  # labels related to deployment resource
  labels:
    app: app-1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app-1
  # Pod
  template:
    metadata:
      labels:
        app: app-1
    spec:
      containers:
      - name: app-1
        image: sivajanardhan/app1
        ports:
        - containerPort: 80

---
apiVersion: v1 
kind: Service 
metadada: 
  name: app-1
  # servicer labels
  labels:
    app: app-1
spec:
    # Service uses the below labels to select the pods
  selector:
    app: app-1
  ports:
    - protocol: TCP
      port: 80 # service port
      targetPort: 80 # container port
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-1
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS": 443}]'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:892577688117:certificate/f19ad6ca-25ff-49d6-9a69-37cb8a94737d
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/tags: Environment=dev,Team=test
    alb.ingress.kubernetes.io/group.name: roboshop
spec:
  ingressClassName: alb
  rules:
  - host: "app1.janadevops.online"
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: app-1
            port:
              number: 80



